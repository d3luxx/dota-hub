<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOTA META LAB — 127 Heroes Database & Pro Drafter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0d13; color: #f3f4f6; }
    .nav-btn-active { color: #ffffff !important; border-bottom: 2px solid #e11d48 !important; }
    .hero-selected-ally { outline: 2px solid #10b981; filter: brightness(0.25); pointer-events: none; }
    .hero-selected-enemy { outline: 2px solid #e11d48; filter: brightness(0.25); pointer-events: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #121520; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white antialiased">

  <header class="bg-[#121520] border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-4 sm:gap-8">
        <div onclick="switchTab('draft')" class="flex items-center gap-2 cursor-pointer flex-shrink-0">
          <div class="w-8 h-8 rounded-lg bg-rose-600 flex items-center justify-center text-white font-black text-xs shadow-md shadow-rose-600/30">ML</div>
          <span class="font-black text-sm tracking-wider text-white hidden xs:inline">META LAB</span>
        </div>

        <nav class="flex items-center gap-2 sm:gap-6 text-xs font-bold uppercase tracking-wider">
          <button onclick="switchTab('draft')" id="nav-draft" class="nav-btn-active py-4 text-zinc-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-crosshairs"></i> <span>Драфт 5х5</span>
          </button>
          <button onclick="switchTab('heroes')" id="nav-heroes" class="py-4 text-zinc-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-users"></i> <span>Герои</span>
          </button>
          <button onclick="switchTab('tierlist')" id="nav-tierlist" class="py-4 text-zinc-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-layer-group"></i> <span>Тир-лист</span>
          </button>
        </nav>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="copyShareUrl()" class="px-2.5 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 text-[11px] font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-share-nodes text-rose-500"></i> <span class="hidden sm:inline">Поделиться</span>
        </button>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-500/10 text-rose-400 border border-rose-500/20">
          127 Heroes
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-1 w-full space-y-5">

    <section id="tab-draft" class="space-y-4 sm:space-y-6">
      
      <div id="comboAlertBanner" class="hidden bg-rose-950/40 border border-rose-500/50 rounded-2xl p-3.5 sm:p-4 text-xs space-y-1 shadow-xl"></div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <div class="bg-[#121520] border border-emerald-500/30 rounded-2xl p-3.5 sm:p-4 shadow-xl space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs sm:text-sm font-black text-emerald-400 flex items-center gap-1.5">
              <i class="fa-solid fa-users"></i> ВАША КОМАНДА (СОЮЗНИКИ)
            </h2>
            <div class="flex items-center gap-1.5">
              <button onclick="setPickTarget('ally')" id="btnPickAlly" class="px-2 py-1 rounded bg-emerald-600 text-white text-[10px] font-bold">Выбор в команду</button>
              <button onclick="clearTeam('ally')" class="text-zinc-400 hover:text-emerald-400 text-xs px-2 py-1 bg-zinc-800 rounded"><i class="fa-solid fa-rotate-left"></i></button>
            </div>
          </div>
          <div id="allySlotsContainer" class="grid grid-cols-5 gap-1.5 sm:gap-2"></div>
          
          <div id="allyMetricsContainer" class="grid grid-cols-3 gap-2 pt-2 border-t border-zinc-800 text-[11px]">
            <div class="bg-[#181c2b] p-2 rounded-lg text-center">
              <span class="text-zinc-400 block text-[9px]">КОНТРОЛЬ</span>
              <span id="metricStun" class="font-black text-emerald-400">0 / 5</span>
            </div>
            <div class="bg-[#181c2b] p-2 rounded-lg text-center">
              <span class="text-zinc-400 block text-[9px]">ПУШ БАШЕН</span>
              <span id="metricPush" class="font-black text-emerald-400">0 / 5</span>
            </div>
            <div class="bg-[#181c2b] p-2 rounded-lg text-center">
              <span class="text-zinc-400 block text-[9px]">СИЛА В ЛЕЙТЕ</span>
              <span id="metricLate" class="font-black text-emerald-400">0 / 5</span>
            </div>
          </div>
        </div>

        <div class="bg-[#121520] border border-rose-500/30 rounded-2xl p-3.5 sm:p-4 shadow-xl space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs sm:text-sm font-black text-rose-400 flex items-center gap-1.5">
              <i class="fa-solid fa-skull"></i> ВРАЖЕСКАЯ КОМАНДА
            </h2>
            <div class="flex items-center gap-1.5">
              <button onclick="setPickTarget('enemy')" id="btnPickEnemy" class="px-2 py-1 rounded bg-zinc-800 text-zinc-400 text-[10px] font-bold">Выбор врага</button>
              <button onclick="clearTeam('enemy')" class="text-zinc-400 hover:text-rose-400 text-xs px-2 py-1 bg-zinc-800 rounded"><i class="fa-solid fa-rotate-left"></i></button>
            </div>
          </div>
          <div id="enemySlotsContainer" class="grid grid-cols-5 gap-1.5 sm:gap-2"></div>

          <div class="pt-2 border-t border-zinc-800 flex items-center justify-between text-xs px-1">
            <span class="text-zinc-400 font-bold">Оценка драфта:</span>
            <span id="winrateEstimate" class="font-black text-rose-400">50% / 50%</span>
          </div>
        </div>

      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6">
        
        <div class="lg:col-span-7 bg-[#121520] border border-zinc-800 rounded-2xl p-3.5 sm:p-5 shadow-xl space-y-3">
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 border-b border-zinc-800/80 pb-3">
            <div class="relative w-full sm:w-44">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-zinc-400 text-xs"></i>
              <input type="text" id="heroSearchInput" oninput="handleSearch(this.value)" placeholder="Поиск героя..." class="w-full bg-[#181c2b] border border-zinc-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-rose-500">
            </div>

            <div class="flex items-center justify-between sm:justify-start gap-1 overflow-x-auto pb-1 sm:pb-0" id="attrFilterButtons">
              <button onclick="filterHeroGrid('all')" class="px-2 py-1 rounded bg-rose-600 text-white text-[10px] font-bold whitespace-nowrap">Все (127)</button>
              <button onclick="filterHeroGrid('str')" class="px-2 py-1 rounded bg-zinc-800 text-red-400 border border-red-500/20 text-[10px] font-bold whitespace-nowrap">🔴 Сила</button>
              <button onclick="filterHeroGrid('agi')" class="px-2 py-1 rounded bg-zinc-800 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold whitespace-nowrap">🟢 Ловкость</button>
              <button onclick="filterHeroGrid('int')" class="px-2 py-1 rounded bg-zinc-800 text-sky-400 border border-sky-500/20 text-[10px] font-bold whitespace-nowrap">🔵 Интеллект</button>
              <button onclick="filterHeroGrid('uni')" class="px-2 py-1 rounded bg-zinc-800 text-purple-400 border border-purple-500/20 text-[10px] font-bold whitespace-nowrap">🟣 Универсал</button>
            </div>
          </div>

          <div id="heroesSelectionGrid" class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 gap-2 max-h-[480px] overflow-y-auto pr-1"></div>
        </div>

        <div class="lg:col-span-5 space-y-4">
          
          <div class="bg-[#121520] border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-2.5">
            <h3 class="text-xs sm:text-sm font-black uppercase tracking-wider text-amber-400 flex items-center gap-2">
              <i class="fa-solid fa-shield"></i> Контр-предметы против врагов
            </h3>
            <div id="recommendedItemsList" class="space-y-2">
              <p class="text-zinc-500 text-xs italic py-1 text-center">Выберите врагов для подбора ключевых предметов.</p>
            </div>
          </div>

          <div class="bg-[#121520] border border-zinc-800 rounded-2xl p-4 sm:p-5 shadow-xl space-y-2.5">
            <h3 class="text-xs sm:text-sm font-black uppercase tracking-wider text-rose-400 flex items-center gap-2">
              <i class="fa-solid fa-crosshairs"></i> Приоритет фо
