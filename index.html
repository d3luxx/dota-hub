<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOTA HUB — Рейтинг команд и статистика</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0d13; color: #f3f4f6; }
    .nav-btn-active { color: #ffffff !important; border-bottom: 2px solid #e11d48 !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

  <!-- ШАПКА -->
  <header class="bg-[#121520] border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-8">
        <div onclick="navigate('teams-ranking')" class="flex items-center gap-2 cursor-pointer">
          <div class="w-8 h-8 rounded-lg bg-rose-600 flex items-center justify-center text-white font-black text-sm shadow-md shadow-rose-600/30">DH</div>
          <span class="font-black text-sm tracking-wider text-white">DOTA HUB</span>
        </div>

        <nav class="flex items-center gap-6 text-xs font-bold uppercase tracking-wider">
          <button onclick="navigate('teams-ranking')" id="nav-teams-ranking" class="nav-btn-active py-4 text-zinc-400 hover:text-white transition flex items-center gap-1.5">
            <i class="fa-solid fa-shield"></i> Рейтинг команд
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- 1. ТАБЛИЦА РЕЙТИНГА КОМАНД -->
    <section id="page-teams-ranking" class="space-y-4">
      <div class="border-b border-zinc-800 pb-3">
        <h1 class="text-xl font-black text-white flex items-center gap-2">
          <i class="fa-solid fa-users text-rose-500"></i> DOTA 2 TEAM RANKING
        </h1>
        <p class="text-xs text-zinc-400">Мировой рейтинг профессиональных клубов</p>
      </div>

      <div class="bg-[#121520] border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-[#181c2b] text-zinc-400 uppercase text-[10px] font-bold border-b border-zinc-800">
              <th class="py-3 px-4 w-16">Rank</th>
              <th class="py-3 px-4">Team name</th>
              <th class="py-3 px-3 text-center">Rating</th>
              <th class="py-3 px-3 text-center">Region</th>
              <th class="py-3 px-3 text-center">Games</th>
              <th class="py-3 px-4 text-right">Win (%)</th>
            </tr>
          </thead>
          <tbody id="teamsTableBody" class="divide-y divide-zinc-800/60"></tbody>
        </table>
      </div>
    </section>

    <!-- 2. СТРАНИЦА КОМАНДЫ (PARIVISION ROSTER) -->
    <section id="page-team-details" class="hidden space-y-6">
      <button onclick="navigate('teams-ranking')" class="text-xs font-bold text-zinc-400 hover:text-white flex items-center gap-1.5 transition">
        <i class="fa-solid fa-arrow-left"></i> Назад к рейтингу команд
      </button>

      <!-- Шапка команды -->
      <div class="bg-[#121520] border border-zinc-800 rounded-2xl p-6 shadow-xl">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
          
          <div class="lg:col-span-4 flex items-center gap-5">
            <div id="teamLogoWrap" class="w-24 h-24 rounded-2xl bg-[#181c2b] border border-zinc-700 p-2 flex items-center justify-center flex-shrink-0 shadow-lg"></div>
            <div>
              <h2 id="teamHeaderName" class="text-2xl font-black text-white"></h2>
              <div class="flex items-center gap-2 mt-1">
                <span id="teamRegionBadge" class="text-xs font-bold px-2 py-0.5 rounded bg-zinc-800 text-zinc-300"></span>
                <span id="teamRankPos" class="text-xs font-mono font-bold text-amber-400"></span>
              </div>
            </div>
          </div>

          <div class="lg:col-span-4 grid grid-cols-2 gap-y-3 text-xs border-y lg:border-y-0 lg:border-l lg:border-r border-zinc-800 py-3 lg:py-0 lg:px-6">
            <div>
              <span class="text-zinc-500 block text-[11px]">Maps played:</span>
              <span id="teamMapsPlayed" class="font-bold text-zinc-200"></span>
            </div>
            <div>
              <span class="text-zinc-500 block text-[11px]">Events:</span>
              <span class="font-bold text-zinc-200">35</span>
            </div>
            <div>
              <span class="text-zinc-500 block text-[11px]">Prize money:</span>
              <span id="teamPrizeTotal" class="font-bold text-emerald-400 font-mono text-sm"></span>
            </div>
            <div>
              <span class="text-zinc-500 block text-[11px]">Rating:</span>
              <span id="teamRatingScore" class="font-mono font-bold text-rose-400"></span>
            </div>
          </div>

          <div class="lg:col-span-4 space-y-2">
            <div class="flex justify-between text-xs font-bold">
              <span class="text-zinc-400">Винрейт команды</span>
              <span id="teamWinLossText" class="text-zinc-200"></span>
            </div>
            <div class="w-full h-2.5 bg-zinc-800 rounded-full overflow-hidden flex">
              <div id="teamWinBar" class="bg-emerald-500 h-full"></div>
              <div id="teamLossBar" class="bg-rose-500 h-full"></div>
            </div>
            <div class="text-right text-xs font-black text-emerald-400" id="teamWinPctText"></div>
          </div>

        </div>
      </div>

      <!-- MAIN ROSTER 5X5 -->
      <div class="space-y-3">
        <h3 class="font-black text-sm uppercase tracking-wider text-white flex items-center gap-2">
          <i class="fa-solid fa-users text-rose-500"></i> MAIN ROSTER (АКТИВНЫЙ СОСТАВ 5X5)
        </h3>
        <div id="mainRosterCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>
      </div>
    </section>

  </main>

  <footer class="border-t border-zinc-900 bg-[#07080d] py-5 text-center text-xs text-zinc-600">
    <p>© 2026 DOTA HUB</p>
  </footer>

  <script>
    // НАДЕЖНЫЕ ОФИЦИАЛЬНЫЕ CDN VALVE & STEAM ДЛЯ ИГРОКОВ И ЛОГОТИПОВ
    const TEAMS_DATABASE = [
      {
        id: "parivision",
        rank: 1,
        name: "PARIVISION",
        logoSvg: `<svg viewBox="0 0 100 100" class="w-16 h-16"><circle cx="50" cy="50" r="45" fill="#181c2b"/><path d="M30 30 L50 50 L30 70 M70 30 L50 50 L70 70" stroke="#10b981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        rating: "3.37",
        region: "WEU",
        regionFlag: "🇪🇺",
        games: 263,
        wins: 172,
        losses: 91,
        winrate: "65%",
        prize: "$3 800 069",
        roster: [
          { 
            pos: "1", role: "Carry", nick: "Satanic", real: "Alan Gallyamov", flag: "🇷🇺", 
            photo: "https://avatars.steamstatic.com/d5a2ca6848be46bcf3ce81b0a88a0e8d0e7225dc_full.jpg",
            rankIcon: "1", wr: "68%" 
          },
          { 
            pos: "2", role: "Mid", nick: "No[o]ne-", real: "Volodymyr Minenko", flag: "🇺🇦", 
            photo: "https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg",
            rankIcon: "2", wr: "64%" 
          },
          { 
            pos: "3", role: "Offlane", nick: "Noticed", real: "Evgeny Ignatenko", flag: "🇷🇺", 
            photo: "https://avatars.steamstatic.com/b9bbcaecf9c8f00db10ff74dcf7d727b1731bb36_full.jpg",
            rankIcon: "3", wr: "62%" 
          },
          { 
            pos: "4", role: "Soft Support", nick: "9Class", real: "Edgar Naltakian", flag: "🇷🇺", 
            photo: "https://avatars.steamstatic.com/b9cfcb7c4fa66c6bbf8db5ce86f8510c4369e832_full.jpg",
            rankIcon: "4", wr: "65%" 
          },
          { 
            pos: "5", role: "Hard Support", nick: "Dukalis", real: "Andrey Kuropatkin", flag: "🇷🇺", 
            photo: "https://avatars.steamstatic.com/a470bb073f324227318029a1bfaee4eb75628b05_full.jpg",
            rankIcon: "5", wr: "63%" 
          }
        ]
      },
      {
        id: "falcons",
        rank: 2,
        name: "Team Falcons",
        logoSvg: `<svg viewBox="0 0 100 100" class="w-16 h-16 fill-emerald-500"><path d="M50 5 L85 25 L85 65 L50 95 L15 65 L15 25 Z"/></svg>`,
        rating: "3.26",
        region: "MESWA",
        regionFlag: "🇸🇦",
        games: 306,
        wins: 190,
        losses: 116,
        winrate: "62%",
        prize: "$2 950 000",
        roster: [
          { pos: "1", role: "Carry", nick: "skiter", real: "Oliver Lepko", flag: "🇸🇰", photo: "https://avatars.steamstatic.com/b9cfcb7c4fa66c6bbf8db5ce86f8510c4369e832_full.jpg", rankIcon: "1", wr: "69%" },
          { pos: "2", role: "Mid", nick: "Malr1ne", real: "Станислав Поторак", flag: "🇷🇺", photo: "https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg", rankIcon: "2", wr: "70%" },
          { pos: "3", role: "Offlane", nick: "ATF", real: "Ammar Al-Assaf", flag: "🇯🇴", photo: "https://avatars.steamstatic.com/b9bbcaecf9c8f00db10ff74dcf7d727b1731bb36_full.jpg", rankIcon: "3", wr: "72%" },
          { pos: "4", role: "Soft Support", nick: "Cr1t-", real: "Andreas Nielsen", flag: "🇩🇰", photo: "https://avatars.steamstatic.com/d5a2ca6848be46bcf3ce81b0a88a0e8d0e7225dc_full.jpg", rankIcon: "4", wr: "65%" },
          { pos: "5", role: "Hard Support", nick: "Sneyking", real: "Jingjun Wu", flag: "🇺🇸", photo: "https://avatars.steamstatic.com/a470bb073f324227318029a1bfaee4eb75628b05_full.jpg", rankIcon: "5", wr: "64%" }
        ]
      }
    ];

    function navigate(pageId) {
      ['teams-ranking', 'team-details'].forEach(p => {
        const el = document.getElementById(`page-${p}`);
        if (el) el.classList.add('hidden');
      });
      document.getElementById(`page-${pageId}`).classList.remove('hidden');

      if (pageId === 'teams-ranking') renderTeamsTable();
    }

    function renderTeamsTable() {
      const tbody = document.getElementById('teamsTableBody');
      tbody.innerHTML = '';
      TEAMS_DATABASE.forEach(t => {
        tbody.innerHTML += `
          <tr onclick="openTeamDetails('${t.id}')" class="hover:bg-[#181c2b] cursor-pointer transition">
            <td class="py-3.5 px-4 font-bold text-zinc-400">
              <span class="w-6 h-6 rounded bg-zinc-800 flex items-center justify-center font-mono text-white text-xs">${t.rank}</span>
            </td>
            <td class="py-3.5 px-4">
              <div class="flex items-center gap-3">
                <div class="w-7 h-7 flex items-center justify-center">${t.logoSvg}</div>
                <span class="font-extrabold text-sm text-white hover:text-rose-400 transition">${t.name}</span>
              </div>
            </td>
            <td class="py-3.5 px-3 text-center font-mono font-bold text-zinc-200">${t.rating}</td>
            <td class="py-3.5 px-3 text-center"><span class="text-xs font-semibold text-zinc-300">${t.regionFlag} ${t.region}</span></td>
            <td class="py-3.5 px-3 text-center font-mono text-zinc-400">${t.games}</td>
            <td class="py-3.5 px-4 text-right font-black text-emerald-400 font-mono">${t.winrate}</td>
          </tr>
        `;
      });
    }

    function openTeamDetails(teamId) {
      const t = TEAMS_DATABASE.find(item => item.id === teamId) || TEAMS_DATABASE[0];
      navigate('team-details');

      document.getElementById('teamHeaderName').textContent = t.name;
      document.getElementById('teamLogoWrap').innerHTML = t.logoSvg;
      document.getElementById('teamRegionBadge').textContent = `${t.regionFlag} ${t.region}`;
      document.getElementById('teamRankPos').textContent = `Ранг #${t.rank}`;
      document.getElementById('teamMapsPlayed').textContent = `${t.games} (за год)`;
      document.getElementById('teamPrizeTotal').textContent = t.prize;
      document.getElementById('teamRatingScore').textContent = t.rating;

      document.getElementById('teamWinLossText').textContent = `${t.wins}W - ${t.losses}L`;
      document.getElementById('teamWinBar').style.width = t.winrate;
      document.getElementById('teamLossBar').style.width = `${100 - parseInt(t.winrate)}%`;
      document.getElementById('teamWinPctText').textContent = `${t.winrate} Winrate`;

      // 5 карточек с реальными портретами
      const rosterCards = document.getElementById('mainRosterCards');
      rosterCards.innerHTML = '';
      t.roster.forEach(p => {
        rosterCards.innerHTML += `
          <div class="bg-white rounded-2xl p-3.5 shadow-2xl border border-zinc-200 text-zinc-900 flex flex-col justify-between overflow-hidden">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-black uppercase bg-zinc-900 text-white px-2 py-0.5 rounded tracking-wider">${p.role}</span>
                <span class="text-xs font-bold">${p.flag}</span>
              </div>
              
              <!-- Фотография игрока со Steam CDN -->
              <div class="relative w-full h-44 rounded-xl overflow-hidden bg-zinc-100 mb-3 border border-zinc-200 shadow-inner">
                <img src="${p.photo}" class="w-full h-full object-cover" alt="${p.nick}">
                <div class="absolute bottom-1.5 right-1.5 bg-amber-500 text-black font-black text-[9px] px-1.5 py-0.5 rounded shadow">
                  #${p.rankIcon}
                </div>
              </div>
              
              <h4 class="font-black text-base text-zinc-950 leading-tight">${p.nick}</h4>
              <p class="text-[11px] text-zinc-500 font-medium">${p.real}</p>
            </div>

            <div class="mt-3 pt-2.5 border-t border-zinc-100 flex justify-between items-center text-xs">
              <span class="text-zinc-500 text-[10px]">Винрейт: <b class="text-emerald-600">${p.wr}</b></span>
              <span class="text-rose-600 font-bold text-xs">Профиль →</span>
            </div>
          </div>
        `;
      });
    }

    // Стартуем сразу с открытия PARIVISION
    openTeamDetails('parivision');
  </script>
</body>
</html>
